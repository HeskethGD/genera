name: Publish to PyPI
run-name: Publish ${{ inputs.tag }} to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Require the main workflow
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "Run this workflow from main; enter the release tag in the tag input."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and resolve the tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Expected a release tag such as v0.1.0 or v0.2.0rc1."
            exit 1
          fi
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Publishing $RELEASE_TAG from commit $commit" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Test release (Python ${{ matrix.python-version }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  build:
    name: Build and validate distributions
    needs: [prepare, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[develop]"
      - run: ruff check .
      - run: sphinx-build -W --keep-going -b html docs build/sphinx/html
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check distribution names and versions
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import email
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          version = os.environ["RELEASE_TAG"][1:]
          expected = {f"genera-{version}-py3-none-any.whl", f"genera-{version}.tar.gz"}
          files = list(Path("dist").iterdir())
          actual = {path.name for path in files}
          if actual != expected:
              raise SystemExit(f"Expected {expected}, found {actual}")
          for path in files:
              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as archive:
                      name = next(n for n in archive.namelist() if n.endswith("/METADATA"))
                      data = archive.read(name)
              else:
                  with tarfile.open(path) as archive:
                      data = archive.extractfile(f"genera-{version}/PKG-INFO").read()
              metadata = email.message_from_bytes(data)
              if metadata["Name"] != "genera" or metadata["Version"] != version:
                  raise SystemExit(f"Unexpected package metadata in {path}")
          print(f"Validated both genera {version} distributions.")
          PY
      - name: Test the installed wheel with runtime dependencies only
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-smoke/bin/python" - <<'PY'
          import os
          from mpmath import mp
          import genera

          assert genera.__version__ == os.environ["RELEASE_TAG"][1:]
          mp.dps = 25
          curve = genera.Curve({(0, 2): 1, (3, 0): -1, (1, 0): 1})
          periods = curve.periods_kind_1()
          assert curve.genus == 1
          assert curve.validate(periods).passed
          assert mp.almosteq(periods.tau[0, 0], mp.j)
          assert mp.almosteq(
              genera.rtheta([0], [[mp.j]]), mp.jtheta(3, 0, mp.exp(-mp.pi)))
          print("Installed-wheel smoke checks passed.")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish validated distributions
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/genera/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
